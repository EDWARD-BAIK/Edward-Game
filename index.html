<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDWARD GAME</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            background: #060913; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none;
        }

        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #060913; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader-title {
            font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .progress-box {
            width: 240px; height: 10px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }
        .progress-bar {
            width: 0%; height: 100%; background: linear-gradient(90deg, #ff4500, #ffaa00);
            border-radius: 10px; transition: width 0.3s ease;
        }
        .loading-status { color: #94a3b8; font-size: 12px; margin-top: 10px; font-weight: 600; }

        #loginOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #060913 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; display: none; transition: opacity 0.4s ease;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px; padding: 32px 28px; width: 88%; max-width: 380px;
            text-align: center; color: #fff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .login-card h1 {
            margin: 0 0 6px; font-size: 34px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }

            width: 100%; padding: 14px 18px; font-size: 15px; color: #fff; font-weight: 600;

        }
        .input-group input[type="text"]:focus {
            border-color: #ff4500; box-shadow: 0 0 16px rgba(255,69,0,0.35);
        }
        
        .color-picker { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        .color-opt {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        .color-opt.selected { border-color: #ffffff; transform: scale(1.2); }

<script>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSfx(freqStart, freqEnd, type, duration, vol) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}


function showToast(msg, isSuccess = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    if (isSuccess) toast.classList.add('toast-success');
    else toast.classList.remove('toast-success');
    
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatDist(d) {
    if (d >= 1000) {
        let km = (d / 1000).toFixed(1);
        return (km.endsWith('.0') ? km.slice(0, -2) : km) + "km";
    }
    return d + "m";
}

function lerpColor(c1, c2, t) {
    const hex2rgb = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
    const [r1, g1, b1] = hex2rgb(c1);
    const [r2, g2, b2] = hex2rgb(c2);
    const r = Math.round(r1 + (r2 - r1)*t);
    const g = Math.round(g1 + (g2 - g1)*t);
    const b = Math.round(b1 + (b2 - b1)*t);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

function updateMenuCoins() {
    document.getElementById('menuCoinsDisplay').innerText = `TOTAL KOIN: ${totalCoins} 🪙`;
    document.getElementById('shopTotalCoins').innerText = `${totalCoins} 🪙`;
}

function renderShop() {
    const grid = document.getElementById('shopGrid');
    grid.innerHTML = '';
    skinsData.forEach(skin => {
        const isOwned = ownedSkins.includes(skin.id);
        const isSelected = selectedSkin === skin.id;
        
        let btnHTML = '';
        if (isSelected) {
            btnHTML = `<button class="skin-btn btn-selected" disabled>DIPAKAI</button>`;
        } else if (isOwned) {
            btnHTML = `<button class="skin-btn btn-select" onclick="selectSkin('${skin.id}')">PAKAI</button>`;
        } else {
            btnHTML = `<button class="skin-btn btn-buy" onclick="buySkin('${skin.id}', ${skin.price})">BELI ${skin.price} 🪙</button>`;
        }

        grid.innerHTML += `
            <div class="skin-card ${isOwned ? 'owned' : ''} ${isSelected ? 'selected' : ''}">
                <div class="skin-name">${skin.name}</div>
                ${!isOwned ? `<div class="skin-price">${skin.price} 🪙</div>` : `<div class="skin-price" style="color:#38bdf8;">Dimiliki</div>`}
                ${btnHTML}
            </div>
        `;
    });
}

window.buySkin = function(id, price) {
    initAudio();
    if (totalCoins >= price) {
        totalCoins -= price;
        ownedSkins.push(id);

function triggerFlip() {
    if (!p.isFlipping) {
        p.isFlipping = true;
        p.flipProgress = 0;
        if (p.grounded || p.coyoteTimer > 0) {
            p.vy = -15;
            p.grounded = false;
        } else {
            p.vy = Math.min(p.vy, -10); 
        }
        playSfx(300, 800, 'sine', 0.25, 0.12);
        createDust(p.x + p.w/2, p.y + p.h, 8, true);
    }
}

function createDust(x, y, count = 5, isDoubleJump = false) {
    for(let i=0; i<count; i++) {
        particles.push({
            type: 'dust', x: x + (Math.random()*14 - 7), y: y + (isDoubleJump ? -20 : 0),
            vx: Math.random()*3.5 - 1.75, 
            vy: isDoubleJump ? (Math.random()*3) : (-Math.random()*1.8 - 0.5),
            size: Math.random()*3.5 + 2, alpha: 1
        });
    }
}

function ensureHeartsOnPlatforms() {
    if (lives >= 3) return;
    let availablePlats = platforms.filter(pt => pt.x > p.x + 60 && !pt.coin && !pt.heart);
    if (availablePlats.length > 0) {
        let countToSpawn = Math.min(2, availablePlats.length);
        for (let i = 0; i < countToSpawn; i++) {
            availablePlats[i].heart = true;
        }
    }
}

function updateWorldElements() {
    let lastPlat = platforms[platforms.length - 1];
    let diffMultiplier = Math.min(2.4, 1 + (distance / 700)); 
    
    while (lastPlat.x < cameraX + viewportW + 350) {
        let gap = (65 + Math.random() * 125) * diffMultiplier;
        let newX = lastPlat.x + lastPlat.w + gap; 
        
        let maxJumpUp = gap > (120 * diffMultiplier) ? 35 : (95 * diffMultiplier); 
        let yOffset = (Math.random() * (maxJumpUp + 110)) - maxJumpUp;
        let newY = Math.max(170, Math.min(viewportH - 140, lastPlat.y + yOffset));
        
        let platWidth = (75 + Math.random() * 95) / Math.min(1.4, diffMultiplier);
        
        let isCoin = Math.random() > 0.28;
        let isHeart = !isCoin && (lives < 3) && (Math.random() < 0.4);

        platforms.push({ x: newX, y: newY, w: platWidth, h: 22, coin: isCoin, heart: isHeart });
        lastPlat = platforms[platforms.length - 1];
    }
    platforms = platforms.filter(pt => pt.x + pt.w > cameraX - 250);

    let lastBg = bgElements.length > 0 ? bgElements[bgElements.length - 1] : { x: cameraX * 0.3 };
    while (lastBg.x < (cameraX * 0.3) + viewportW + 450) { 
        bgElements.push({
            x: lastBg.x + 250 + Math.random() * 200,
            scale: 0.5 + Math.random() * 0.5,
            seed: Math.floor(Math.random() * 1000)
        });
        lastBg = bgElements[bgElements.length - 1];
    }
    bgElements = bgElements.filter(bg => bg.x > (cameraX * 0.3) - 350);

    let camParallaxX = cameraX * 0.1;
    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x < camParallaxX - 250) c.x = camParallaxX + viewportW + 250;
    });
}

function drawPlayerAura(ctx, skinId, baseColor) {
    let aura = getAuraColors(skinId, baseColor);
    let pulse = Math.sin(Date.now() * 0.008) * 5;

    ctx.save();
    let grad = ctx.createRadialGradient(0, -20, 5, 0, -20, 32 + pulse);
    grad.addColorStop(0, aura.p);
    grad.addColorStop(0.5, aura.s);
    grad.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.65 + Math.sin(Date.now() * 0.01) * 0.2;
    ctx.beginPath();
    ctx.arc(0, -20, 35 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawBoboiboyCap(ctx, capColor, visorColor, emblem = "B") {
    ctx.fillStyle = capColor;
    ctx.beginPath(); ctx.arc(0, -43, 11.5, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = visorColor;
    ctx.beginPath(); ctx.fillRect(-15, -45, 8, 4); ctx.fill(); 
    if (emblem) {
        ctx.fillStyle = "#ffffff"; ctx.font = "900 8px system-ui"; ctx.textAlign = "center";
        ctx.fillText(emblem, 4, -45);
    }
}

            drawCape("#ef4444"); drawLegs("#3b82f6"); drawArm("#3b82f6", true); drawBody("#3b82f6"); drawArm("#3b82f6", false); drawHead("#ffdbac"); drawEye(4, -44, 1.5); break;
        case 'spiderman':
            drawLegs("#3b82f6"); drawArm("#ef4444", true); drawBody("#ef4444"); drawArm("#ef4444", false); drawHead("#ef4444");
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(5, -44, 4.5, 6.5, Math.PI/8, 0, Math.PI*2); ctx.fill(); break;
        case 'ironman':
            drawLegs("#ef4444"); drawArm("#ef4444", true); drawBody("#ef4444"); drawArm("#ef4444", false); drawHead("#ef4444");
            ctx.fillStyle = "#facc15"; ctx.fillRect(-7, -48, 14, 13); drawEye(4, -44, 1.5, "#38bdf8"); break;
        case 'sonic':
            drawLegs("#ef4444"); drawArm("#3b82f6", true); drawBody("#3b82f6"); drawArm("#3b82f6", false); drawHead("#3b82f6");
            drawEye(5, -44, 2, "#fff"); break;
        case 'default':
        default:
            ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.moveTo(-2, -32);
            ctx.quadraticCurveTo(-15 - p.vx * 2.5, -26 + Math.sin(Date.now()*0.01)*3, -19 - p.vx * 3.5, -13);
            ctx.quadraticCurveTo(-9, -22, -2, -28); ctx.fill();
            drawLegs("#0f172a"); drawArm(baseColor, true); drawBody(baseColor); drawArm(baseColor, false); 
            drawHead("#ffdbac"); drawEye(3, -43, 2.5, "#0f172a"); break;
    }
}

function gameLoop() {
    if (!gameRunning) return;

    const accel = p.grounded ? 0.65 : 0.38; 
    const friction = p.grounded ? 0.82 : 0.91; 

    if (keys.left) { p.vx -= accel; p.facing = -1; } 
    else if (keys.right) { p.vx += accel; p.facing = 1; } 
    else { p.vx *= friction; }
    
    p.vx = Math.max(-6.5, Math.min(6.5, p.vx));
    p.x += p.vx; p.lastY = p.y; 

    p.vy += 0.78; 
    p.y += p.vy;

    if (p.grounded) {
        p.coyoteTimer = 7;
        p.jumpsLeft = 2; 
    } else {
        p.coyoteTimer--;
    }

    if (keys.jumpPressed) {
        if (p.coyoteTimer > 0 || p.jumpsLeft > 0) {
            p.vy = -15;
            
            if (p.coyoteTimer <= 0) {
                p.jumpsLeft--; 
                createDust(p.x + p.w/2, p.y + p.h, 10, true); 
                playSfx(250, 600, 'square', 0.1, 0.08);
            } else {
                p.jumpsLeft--; 
                createDust(p.x + p.w/2, p.y + p.h, 6, false);
                playSfx(180, 450, 'square', 0.12, 0.08);
            }
            
            p.coyoteTimer = 0; 
            p.scaleY = 1.35; p.scaleX = 0.72;
        }
        keys.jumpPressed = false; 
    }

    
    if (p.isFlipping) {
        p.flipProgress += 0.038; 
        if (p.flipProgress >= 1) {
            p.flipProgress = 0;
            p.isFlipping = false;
        }
    }

    p.scaleX += (1 - p.scaleX) * 0.18;
    p.scaleY += (1 - p.scaleY) * 0.18;

    let targetCamX = p.x - viewportW * 0.35;
    cameraX += (targetCamX - cameraX) * 0.08;

    let currentDist = Math.max(0, Math.floor((p.x - 100) / 10));
    if (currentDist > distance) {
        distance = currentDist;
        document.getElementById('distanceHUD').innerText = formatDist(distance);
        
        if (distance > 0 && distance % 500 === 0 && distance !== lastMilestone) {
            lastMilestone = distance;
            let milestoneCoins = 100;
            runCoins += milestoneCoins;
            totalCoins += milestoneCoins;
            localStorage.setItem('edward_total_coins', totalCoins);
            document.getElementById('hudCoins').innerText = runCoins;
            
            playSfx(500, 1200, 'sine', 0.4, 0.2);
            floatingTexts.push({ x: p.x + p.w/2, y: p.y - 60, text: `🎉 +${milestoneCoins} 🪙`, alpha: 1.5 });
            showToast(`Luar Biasa! ${distance}m Tercapai! Bonus ${milestoneCoins} Koin!`, true);
        }
    }

    updateWorldElements();

    let wasGrounded = p.grounded;
    p.grounded = false;

    let dimCheck = Math.floor(distance / 250);
    if(dimCheck > currentDimension && distance > 0) {
        currentDimension = dimCheck;
        dimensionFlash = 1;
        playSfx(800, 150, 'sawtooth', 0.6, 0.3);
        floatingTexts.push({ x: p.x + p.w/2, y: p.y - 30, text: "DIMENSI BARU!", alpha: 1 });
    }
    let curTheme = themes[currentDimension % themes.length];

    platforms.forEach(pt => {
        let isInsideX = p.x + p.w > pt.x && p.x < pt.x + pt.w;
        let isFalling = p.vy > 0;
        if (isInsideX && isFalling && p.lastY + p.h <= pt.y + 12 && p.y + p.h >= pt.y) {
            p.y = pt.y - p.h; p.vy = 0; p.grounded = true;
            if (!wasGrounded) {
                p.scaleY = 0.72; p.scaleX = 1.28;
                createDust(p.x + p.w/2, p.y + p.h, 7);
                playSfx(100, 50, 'sine', 0.08, 0.05);
            }
        }

        if (pt.coin) {
            let cx = pt.x + pt.w / 2, cy = pt.y - 24;
            let dx = (p.x + p.w/2) - cx, dy = (p.y + p.h/2) - cy;
            if (Math.sqrt(dx*dx + dy*dy) < 28) {
                pt.coin = false; 
                runCoins += 10;
                totalCoins += 10;
                localStorage.setItem('edward_total_coins', totalCoins);
                document.getElementById('hudCoins').innerText = runCoins;
                playSfx(750, 1100, 'sine', 0.18, 0.12);
                floatingTexts.push({ x: cx, y: cy, text: "+10 🪙", alpha: 1 });
            }
        }

        if (pt.heart) {
            let hx = pt.x + pt.w / 2, hy = pt.y - 24;
            let dx = (p.x + p.w/2) - hx, dy = (p.y + p.h/2) - hy;
            if (Math.sqrt(dx*dx + dy*dy) < 28) {
                pt.heart = false;
                if (lives < 3) {
                    lives++;
                    updateLivesUI();
                    playSfx(500, 950, 'sine', 0.22, 0.15);
                    floatingTexts.push({ x: hx, y: hy, text: "+1 ❤️", alpha: 1 });
                }
            }
        }
    });

    if (p.grounded && Math.abs(p.vx) > 0.5 && Math.random() < 0.25) createDust(p.x + (p.facing === 1 ? 0 : p.w), p.y + p.h, 1);

    if (p.y > viewportH - 60) {
        if (lives > 1) {
            lives--;
            updateLivesUI();
            playSfx(150, 50, 'sawtooth', 0.25, 0.2);
            floatingTexts.push({ x: p.x + p.w/2, y: viewportH - 120, text: "-1 ❤️", alpha: 1 });
            
            let safePlat = platforms.find(pt => pt.x + pt.w > cameraX + 80 && pt.x < cameraX + viewportW - 100);
            if (!safePlat) safePlat = platforms[0];
            
            p.x = safePlat.x + safePlat.w / 2 - p.w / 2;
            p.y = safePlat.y - p.h - 30;
            p.vx = 0; p.vy = 0; p.grounded = false;

            ensureHeartsOnPlatforms();
        } else {
            lives = 0;
            updateLivesUI();
            gameRunning = false; 
            playSfx(220, 50, 'sawtooth', 0.35, 0.15);
            
            if (distance > highDistance) {
                highDistance = distance; 
                localStorage.setItem('edward_high_dist', highDistance);
                document.getElementById('loginHighScore').innerText = formatDist(highDistance);
            }
            
            document.getElementById('finalScore').innerText = formatDist(distance);
            document.getElementById('bestScore').innerText = formatDist(highDistance);
            document.getElementById('gameOverModal').classList.add('active');
            updateMenuCoins();
            return;
        }
    }

    ctx.clearRect(0, 0, viewportW, viewportH);

    
    let nowTime = new Date();
    let h = nowTime.getHours();
    let m = nowTime.getMinutes();
    let s = nowTime.getSeconds();
    let tDecimal = h + m/60 + s/3600;

    let isDay = tDecimal >= 6 && tDecimal < 18;
    let arcProgress = isDay ? (tDecimal - 6) / 12 : (tDecimal >= 18 ? (tDecimal - 18) / 12 : (tDecimal + 6) / 12);

    let celX = viewportW * 0.1 + (viewportW * 0.8 * arcProgress); 
    let celY = (viewportH * 0.15) + (viewportH * 0.4) * (1 - Math.sin(arcProgress * Math.PI));

    let currentSky1 = curTheme.sky1;
    let currentSky2 = curTheme.sky2;
    let starAlphaMult = 1;

    if (curTheme.type === 'earth') {
        let phases = [
            { h: 0, s1: "#020617", s2: "#0f172a" },
            { h: 5, s1: "#0f172a", s2: "#1e1b4b" },
            { h: 6, s1: "#f97316", s2: "#fde047" },
            { h: 7, s1: "#38bdf8", s2: "#bae6fd" },
            { h: 12, s1: "#0ea5e9", s2: "#7dd3fc" },
            { h: 16, s1: "#38bdf8", s2: "#bae6fd" },
            { h: 17.5, s1: "#f97316", s2: "#fde047" },
            { h: 18.5, s1: "#1e1b4b", s2: "#0f172a" },
            { h: 24, s1: "#020617", s2: "#0f172a" }
        ];
        
        let p1 = phases[0], p2 = phases[1];
        for (let i = 0; i < phases.length - 1; i++) {
            if (tDecimal >= phases[i].h && tDecimal <= phases[i+1].h) {
                p1 = phases[i]; p2 = phases[i+1]; break;
            }
        }
        
        let t = (p2.h === p1.h) ? 0 : (tDecimal - p1.h) / (p2.h - p1.h);
        currentSky1 = lerpColor(p1.s1, p2.s1, t);
        currentSky2 = lerpColor(p1.s2, p2.s2, t);

        if (isDay && tDecimal > 7 && tDecimal < 17) starAlphaMult = 0;
        else if (isDay) starAlphaMult = Math.abs(tDecimal - 12) / 6;
    }

    let skyGrad = ctx.createLinearGradient(0, 0, 0, viewportH);
    skyGrad.addColorStop(0, currentSky1);
    skyGrad.addColorStop(1, currentSky2);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, viewportW, viewportH);

    stars.forEach(s => {
        s.alpha += (Math.random() * 0.04 - 0.02);
        s.alpha = Math.max(0.2, Math.min(1, s.alpha));
        if (starAlphaMult > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starAlphaMult})`;
            ctx.fillRect(s.x - cameraX * 0.05, s.y, s.size, s.size);
        }
    });

    let timeOsc = Math.sin(Date.now() * 0.002);
    if (curTheme.type === 'earth') {
        if (isDay) {
            ctx.fillStyle = "#ffefad"; ctx.beginPath(); ctx.arc(celX, celY, 60 + timeOsc*4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffdd59"; ctx.beginPath(); ctx.arc(celX, celY, 45, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = "#e2e8f0"; ctx.beginPath(); ctx.arc(celX, celY, 45, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#cbd5e1";
            ctx.beginPath(); ctx.arc(celX - 15, celY - 10, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(celX + 10, celY + 15, 12, 0, Math.PI*2); ctx.fill();
        }
    } else if (curTheme.type === 'cyber') {
        if (isDay) {
            ctx.fillStyle = "#ff007f"; ctx.beginPath(); ctx.arc(celX, celY, 50, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = currentSky2;
            for(let i=0; i<5; i++) ctx.fillRect(celX - 55, celY + 5 + i*8, 110, 3);
        } else {
            ctx.fillStyle = "#00ffff"; ctx.beginPath(); ctx.arc(celX, celY, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = currentSky1; ctx.beginPath(); ctx.arc(celX - 12, celY - 8, 35, 0, Math.PI*2); ctx.fill(); 
        }
    } else if (curTheme.type === 'alien') {
        if (isDay) {
            ctx.fillStyle = "#eb4d4b"; ctx.beginPath(); ctx.arc(celX, celY, 45, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(240, 147, 43, 0.6)"; ctx.lineWidth = 14;
            ctx.beginPath(); ctx.ellipse(celX, celY, 70, 20, Math.PI/8, 0, Math.PI*2); ctx.stroke();
        } else {
            ctx.fillStyle = "#6ab04c"; ctx.beginPath(); ctx.arc(celX, celY, 35, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "rgba(186, 220, 88, 0.4)"; ctx.beginPath(); ctx.arc(celX, celY, 50 + timeOsc*5, 0, Math.PI*2); ctx.fill();
        }
    }

    ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
    clouds.forEach(c => {
        let drawX = c.x - cameraX * 0.12; 
        ctx.beginPath();
        ctx.arc(drawX, c.y, 25*c.scale, Math.PI, Math.PI*2);
        ctx.arc(drawX + 15*c.scale, c.y - 10*c.scale, 20*c.scale, Math.PI, Math.PI*2);
        ctx.arc(drawX + 35*c.scale, c.y, 25*c.scale, Math.PI, Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    bgElements.forEach(bg => {
        let drawX = bg.x - cameraX * 0.3;
        ctx.beginPath(); ctx.moveTo(drawX, viewportH - 60);
        ctx.lineTo(drawX + 150*bg.scale, viewportH - 60 - 240*bg.scale - (bg.seed%50));
        ctx.lineTo(drawX + 300*bg.scale, viewportH - 60); ctx.fill();
    });

    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(pt => {
        ctx.fillStyle = curTheme.plat;
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, pt.h + 600, 8); ctx.fill(); 

        ctx.fillStyle = curTheme.top;
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, pt.h, 8); ctx.fill();
        
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y + pt.h, pt.w, 8, 0); ctx.fill();

        if (pt.coin) {
            coinAngle += 0.05;
            let cy = pt.y - 24 + Math.sin(coinAngle + pt.x)*4;
            let cx = pt.x + pt.w/2;
            ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#b45309"; ctx.font = "900 13px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("E", cx, cy);
        }

        if (pt.heart) {
            heartAngle += 0.08;
            let hy = pt.y - 24 + Math.sin(heartAngle + pt.x) * 4;
            let hx = pt.x + pt.w / 2;
            ctx.save(); ctx.translate(hx, hy); 
            ctx.scale(1 + Math.sin(heartAngle*1.5)*0.1, 1 + Math.sin(heartAngle*1.5)*0.1);
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.bezierCurveTo(0, -9, 8, -9, 8, -3);
            ctx.bezierCurveTo(8, 2, 0, 8, 0, 10);
            ctx.bezierCurveTo(0, 8, -8, 2, -8, -3);
            ctx.bezierCurveTo(-8, -9, 0, -9, 0, -3);
            ctx.fill(); ctx.restore();
        }
    });

    ctx.save();
    
    
    let legSwing = p.grounded ? Math.sin(p.walkCycle) * 7.5 : (p.vy > 0 ? -4 : 6);
    if(p.grounded && Math.abs(p.vx) > 0.5) p.walkCycle += 0.38; else legSwing = 0;
    
    let bounce = p.grounded ? Math.abs(Math.sin(p.walkCycle)) * 2 : 0;
    if (p.isFlipping) bounce = 0;

    
    ctx.translate(p.x + p.w/2, p.y + p.h/2); 
    ctx.scale(p.scaleX * p.facing, p.scaleY); 

    if (p.isFlipping) {
    
        let flipEase = p.flipProgress < 0.5 ? 2 * p.flipProgress * p.flipProgress : 1 - Math.pow(-2 * p.flipProgress + 2, 2) / 2;
        ctx.rotate(flipEase * Math.PI * 2);
    }

    
    ctx.translate(0, p.h/2);
    
   
    ctx.translate(0, bounce);

    drawPlayerAura(ctx, selectedSkin, playerColor);
    drawPlayerSkin(ctx, p, legSwing, selectedSkin, playerColor);

    ctx.restore();

    particles.forEach((pt, i) => {
        pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.025; pt.size *= 0.95;
        ctx.fillStyle = `rgba(255,255,255,${pt.alpha})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
        if(pt.alpha <= 0) particles.splice(i, 1);
    });

    floatingTexts.forEach((ft, i) => {
        ft.y -= 1.2; ft.alpha -= 0.015;
        ctx.fillStyle = `rgba(255, 215, 0, ${ft.alpha})`;
        if (ft.text.includes("❤️")) ctx.fillStyle = `rgba(255, 71, 87, ${ft.alpha})`;
        if (ft.text.includes("DIMENSI")) ctx.fillStyle = `rgba(56, 189, 248, ${ft.alpha})`;
        ctx.font = "900 16px system-ui"; ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.shadowBlur = 0;
        if(ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    ctx.restore(); 

    ctx.fillStyle = curTheme.lava;
    ctx.fillRect(0, viewportH - 60, viewportW, 60);
    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
    ctx.beginPath();
    for(let i=0; i<=viewportW; i+=20) ctx.lineTo(i, viewportH - 60 + Math.sin(i*0.04 + Date.now()*0.003)*12);
    ctx.lineTo(viewportW, viewportH); ctx.lineTo(0, viewportH); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(0, viewportH - 30, viewportW, 30);

    if (dimensionFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${dimensionFlash})`;
        ctx.fillRect(0, 0, viewportW, viewportH);
        dimensionFlash -= 0.03;
    }

    if (gameRunning) animId = requestAnimationFrame(gameLoop);
}
</script>
