<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDWARD Game</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            background: #090a0f; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; /* Mencegah menu pop-up di mobile */
        }

        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #090a0f; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader-title {
            font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .progress-box {
            width: 240px; height: 10px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }
        .progress-bar {
            width: 0%; height: 100%; background: linear-gradient(90deg, #ff4500, #ffaa00);
            border-radius: 10px; transition: width 0.3s ease;
        }
        .loading-status { color: #94a3b8; font-size: 12px; margin-top: 10px; font-weight: 600; }

        #loginOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090a0f 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; display: none; transition: opacity 0.4s ease;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px; padding: 32px 28px; width: 88%; max-width: 380px;
            text-align: center; color: #fff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .login-card h1 {
            margin: 0 0 6px; font-size: 34px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        .input-group input[type="text"] {
            width: 100%; padding: 14px 18px; font-size: 15px; color: #fff; font-weight: 600;
            background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 14px; outline: none; transition: all 0.3s ease;
        }
        .input-group input[type="text"]:focus {
            border-color: #ff4500; box-shadow: 0 0 16px rgba(255,69,0,0.35);
        }
        
        .color-picker { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        .color-opt {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            -webkit-tap-highlight-color: transparent; 
        }
        .color-opt.selected { border-color: #ffffff; transform: scale(1.2); }

        #startBtn {
            width: 100%; padding: 16px; font-size: 16px; font-weight: 800; color: white;
            background: linear-gradient(45deg, #ff4500, #ff7700);
            border: none; border-radius: 14px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 69, 0, 0.4); margin-top: 12px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #startBtn:active { transform: scale(0.97); }

        .high-score-tag {
            margin-top: 18px; font-size: 13px; color: #38bdf8; font-weight: 700;
            background: rgba(56, 189, 248, 0.1); padding: 8px 14px; border-radius: 20px;
            display: inline-block; border: 1px solid rgba(56, 189, 248, 0.2);
        }

        #gameUI {
            position: absolute; top: 18px; left: 18px; right: 18px;
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); 
            padding: 10px 14px; border-radius: 20px; color: white;
            border: 1px solid rgba(255,255,255,0.15); font-weight: 700; font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 5px;
        }
        .lives-badge { color: #ff4757; font-weight: 900; }

      
        .ctrl, #jumpBtn, #openShopBtn, #closeShopBtn, .skin-btn, .btn-modal {
            -webkit-tap-highlight-color: transparent; /* Kunci menghilangkan kotak biru */
            outline: none;
        }

        .ctrl { 
            position: absolute; bottom: 25px; width: 70px; height: 70px; 
            background: rgba(255,255,255,0.15);
            border-radius: 50%; font-size: 24px; color: white; z-index: 100; 
            border: 1.5px solid rgba(255,255,255,0.3); display: flex; 
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.1s;
        }
        .ctrl:active { background: rgba(255,69,0,0.6); border-color: #ff4500; }
        #leftBtn { left: 20px; } 
        #rightBtn { left: 100px; }
        #jumpBtn { 
            position: absolute; bottom: 25px; right: 20px; width: 80px; height: 80px; 
            border-radius: 50%; background: linear-gradient(135deg, #ff4500, #ff7700); 
            color: white; font-size: 13px; font-weight: 900; z-index: 100; 
            border: 2px solid #ffffff; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 8px 20px rgba(255, 69, 0, 0.5);
            letter-spacing: 0.5px;
        }
        #jumpBtn:active { transform: scale(0.92); }

        #gameOverModal { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0.85); 
            background: rgba(15, 23, 42, 0.95);
            padding: 28px; border-radius: 28px; text-align: center; color: white;
            display: none; opacity: 0; z-index: 999; width: 88%; max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #gameOverModal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #gameOverModal h2 { color: #ff4500; margin: 0 0 8px; font-size: 26px; font-weight: 900; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal {
            flex: 1; padding: 14px; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; font-size: 13px;
        }
        #respawnBtn { background: #ff4500; color: white; box-shadow: 0 4px 15px rgba(255,69,0,0.4); }
        #changeUserBtn { background: rgba(255,255,255,0.15); color: white; }

        
        #shopModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 1500;
            display: none; flex-direction: column; padding: 25px 20px;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .shop-header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .shop-header h2 { margin: 0; color: #38bdf8; font-weight: 900; letter-spacing: 1px; }
        #shopTotalCoins { color: #ffd700; font-weight: 900; font-size: 18px; background: rgba(255,215,0,0.1); padding: 5px 12px; border-radius: 12px;}
        #closeShopBtn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; font-weight: bold; line-height: 1;}
        .shop-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px; overflow-y: auto; padding-bottom: 40px; 
        }
        .skin-card {
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 15px 10px; text-align: center; color: white;
            transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .skin-card.owned { border-color: #38bdf8; }
        .skin-card.selected { border-color: #ff4500; background: rgba(255, 69, 0, 0.1); transform: scale(1.05); box-shadow: 0 5px 15px rgba(255,69,0,0.3);}
        .skin-name { font-weight: 800; margin-bottom: 5px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;}
        .skin-price { color: #ffd700; font-size: 12px; margin-bottom: 12px; font-weight: 600;}
        .skin-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: none;
            font-weight: 800; cursor: pointer; font-size: 11px; transition: transform 0.1s;
        }
        .skin-btn:active { transform: scale(0.95); }
        .btn-buy { background: #ffaa00; color: #000; box-shadow: 0 4px 10px rgba(255, 170, 0, 0.4);}
        .btn-select { background: #38bdf8; color: #000; }
        .btn-selected { background: #ff4500; color: white; box-shadow: 0 4px 10px rgba(255, 69, 0, 0.4);}

    
        #toastMsg {
            position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95); color: white; padding: 12px 25px;
            border-radius: 20px; font-weight: 800; font-size: 14px; z-index: 3000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); pointer-events: none;
            border: 2px solid #fca5a5; text-align: center; white-space: nowrap; letter-spacing: 0.5px;
        }
        #toastMsg.show { top: 30px; }
        
        .toast-success {
            background: rgba(16, 185, 129, 0.95) !important;
            border-color: #6ee7b7 !important;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4) !important;
        }
    </style>
</head>

<script>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSfx(freqStart, freqEnd, type, duration, vol) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}


function showToast(msg, isSuccess = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    if (isSuccess) toast.classList.add('toast-success');
    else toast.classList.remove('toast-success');
    
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatDist(d) {
    if (d >= 1000) {
        let km = (d / 1000).toFixed(1);
        return (km.endsWith('.0') ? km.slice(0, -2) : km) + "km";
    }
    return d + "m";
}


let totalCoins = parseInt(localStorage.getItem('edward_total_coins')) || 0;
let ownedSkins = JSON.parse(localStorage.getItem('edward_owned_skins')) || ['default'];
let selectedSkin = localStorage.getItem('edward_selected_skin') || 'default';
let highDistance = parseInt(localStorage.getItem('edward_high_dist')) || 0;

document.getElementById('loginHighScore').innerText = formatDist(highDistance);

const skinsData = [
    { id: 'default', name: 'default', price: 0 },
    { id: 'ninja', name: 'Ninja', price: 100 },
    { id: 'spongebob', name: 'Spongebob', price: 150 },
    { id: 'patrick', name: 'Patrick', price: 150 },
    { id: 'mario', name: 'Mario', price: 200 },
    { id: 'luigi', name: 'Luigi', price: 200 },
    { id: 'pikachu', name: 'Pikachu', price: 250 },
    { id: 'zombie', name: 'Zombie', price: 250 },
    { id: 'astronaut', name: 'Astronaut', price: 300 },
    { id: 'batman', name: 'Batman', price: 350 },
    { id: 'superman', name: 'Superman', price: 350 },
    { id: 'spiderman', name: 'Spider-Man', price: 400 },
    { id: 'ironman', name: 'Iron Man', price: 450 },
    { id: 'sonic', name: 'Sonic', price: 500 },
    { id: 'goku', name: 'Goku', price: 550 },
    { id: 'naruto', name: 'Naruto', price: 550 },
    { id: 'luffy', name: 'Luffy', price: 600 },
    { id: 'cyborg', name: 'Cyborg', price: 650 },
    { id: 'king', name: 'King', price: 800 },
    { id: 'ultraman', name: 'Ultraman', price: 1000 }
];

function updateMenuCoins() {
    document.getElementById('menuCoinsDisplay').innerText = `TOTAL KOIN: ${totalCoins} 🪙`;
    document.getElementById('shopTotalCoins').innerText = `${totalCoins} 🪙`;
    document.getElementById('hudCoins').innerText = totalCoins;
}

function renderShop() {
    const grid = document.getElementById('shopGrid');
    grid.innerHTML = '';
    skinsData.forEach(skin => {
        const isOwned = ownedSkins.includes(skin.id);
        const isSelected = selectedSkin === skin.id;
        
        let btnHTML = '';
        if (isSelected) {
            btnHTML = `<button class="skin-btn btn-selected" disabled>DIPAKAI</button>`;
        } else if (isOwned) {
            btnHTML = `<button class="skin-btn btn-select" onclick="selectSkin('${skin.id}')">PAKAI</button>`;
        } else {
            btnHTML = `<button class="skin-btn btn-buy" onclick="buySkin('${skin.id}', ${skin.price})">BELI ${skin.price} 🪙</button>`;
        }

        grid.innerHTML += `
            <div class="skin-card ${isOwned ? 'owned' : ''} ${isSelected ? 'selected' : ''}">
                <div class="skin-name">${skin.name}</div>
                ${!isOwned ? `<div class="skin-price">${skin.price} 🪙</div>` : `<div class="skin-price" style="color:#38bdf8;">Dimiliki</div>`}
                ${btnHTML}
            </div>
        `;
    });
}

window.buySkin = function(id, price) {
    initAudio();
    if (totalCoins >= price) {
        totalCoins -= price;
        ownedSkins.push(id);
        localStorage.setItem('edward_total_coins', totalCoins);
        localStorage.setItem('edward_owned_skins', JSON.stringify(ownedSkins));
        playSfx(500, 1000, 'sine', 0.2, 0.1);
        selectSkin(id);
        updateMenuCoins();
        showToast("Skin Berhasil Dibeli!", true);
    } else {
        playSfx(150, 100, 'sawtooth', 0.2, 0.1);
        showToast("Koin tidak cukup!"); 
    }
}

window.selectSkin = function(id) {
    initAudio();
    selectedSkin = id;
    localStorage.setItem('edward_selected_skin', selectedSkin);
    playSfx(400, 600, 'square', 0.1, 0.05);
    renderShop();
}

document.getElementById('openShopBtn').addEventListener('click', () => {
    initAudio();
    document.getElementById('shopModal').style.display = 'flex';
    setTimeout(() => document.getElementById('shopModal').style.opacity = '1', 10);
    renderShop();
});
document.getElementById('closeShopBtn').addEventListener('click', () => {
    initAudio();
    document.getElementById('shopModal').style.opacity = '0';
    setTimeout(() => document.getElementById('shopModal').style.display = 'none', 300);
});

updateMenuCoins();


let playerName = "Tanpa Nama";
let playerColor = "#ff4500";
let animId; 
let lives = 3;
let distance = 0;
let heartAngle = 0;
let lastMilestone = 0; 

function updateLivesUI() {
    let livesEl = document.getElementById('lives');
    if (livesEl) livesEl.innerText = lives;
}

window.addEventListener('load', () => {
    let bar = document.getElementById('progressBar');
    let status = document.getElementById('loadingStatus');
    let progress = 0;
    let interval = setInterval(() => {
        progress += Math.floor(Math.random() * 25) + 15;
        if(progress > 100) progress = 100;
        bar.style.width = progress + '%';
        if (progress === 100) {
            clearInterval(interval);
            status.innerText = "Siap!";
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
                let loginOverlay = document.getElementById('loginOverlay');
                loginOverlay.style.display = 'flex';
                setTimeout(() => loginOverlay.style.opacity = '1', 50);
            }, 300);
        }
    }, 120);
});

document.querySelectorAll('.color-opt').forEach(opt => {
    opt.addEventListener('click', () => {
        document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        playerColor = opt.getAttribute('data-color');
    });
});

function startGame() {
    let input = document.getElementById('playerNameInput').value.trim();
    if (input) playerName = input;
    document.getElementById('displayPlayerName').innerText = playerName;
    
    initAudio();
    playSfx(400, 800, 'sine', 0.15, 0.1);

    let overlay = document.getElementById('loginOverlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 400);

    resetGame();
    cancelAnimationFrame(animId);
    gameLoop();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('respawnBtn').addEventListener('click', startGame);

document.getElementById('changeUserBtn').addEventListener('click', () => {
    document.getElementById('gameOverModal').classList.remove('active');
    let overlay = document.getElementById('loginOverlay');
    overlay.style.display = 'flex';
    setTimeout(() => overlay.style.opacity = '1', 10);
    updateMenuCoins();
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let dpr = 1;
let viewportW = window.innerWidth;
let viewportH = window.innerHeight;

function resizeCanvas() {
    viewportW = window.innerWidth;
    viewportH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2); 
    canvas.width = viewportW * dpr;
    canvas.height = viewportH * dpr;
    canvas.style.width = viewportW + 'px';
    canvas.style.height = viewportH + 'px';
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let p, platforms, particles, floatingTexts, keys, cameraX, gameRunning;
let bgElements = [];
let stars = [];
let clouds = [];
let currentDimension = 0;
let dimensionFlash = 0;

const themes = [
    { type: 'earth', plat: "#1e293b", top: "#00d2d3", lava: "#ff4500", sky1: "#6ebbf5", sky2: "#c5e8ff", night1: "#050B14", night2: "#172033" }, 
    { type: 'cyber', plat: "#2f002c", top: "#ff007f", lava: "#00ffff", sky1: "#10002b", sky2: "#3c096c", night1: "#050014", night2: "#190033" },
    { type: 'alien', plat: "#1a3622", top: "#00e676", lava: "#c51162", sky1: "#4a148c", sky2: "#b71c1c", night1: "#260e40", night2: "#4a0b22" }  
];

function resetGame() {
    lives = 3;
    updateLivesUI();

    p = { 
        x: 100, y: viewportH - 300, lastY: viewportH - 300, 
        w: 24, h: 42, vx: 0, vy: 0, 
        grounded: false, scaleX: 1, scaleY: 1, 
        walkCycle: 0, facing: 1, coyoteTimer: 0, 
        jumpBufferTimer: 0, 
        jumpsLeft: 2 
    };
    
    platforms = [
        { x: 50, y: viewportH - 180, w: 260, h: 25, coin: false, heart: false },
        { x: 360, y: viewportH - 240, w: 160, h: 25, coin: true, heart: false }
    ];
    
    stars = [];
    for(let i=0; i<150; i++){
        stars.push({ x: Math.random() * viewportW, y: Math.random() * viewportH * 0.7, size: Math.random() * 1.5 });
    }

    bgElements = [];
    let startX = 100;
    for(let i=0; i<6; i++){
        startX += 200 + Math.random() * 150;
        bgElements.push({ 
            x: startX, 
            scale: 0.5 + Math.random()*0.5,
            seed: Math.floor(Math.random() * 1000)
        });
    }

    clouds = [];
    for(let i=0; i<7; i++){
        clouds.push({
            x: Math.random() * viewportW * 1.5,
            y: 30 + Math.random() * (viewportH * 0.4),
            scale: 0.5 + Math.random() * 0.8,
            speed: 0.15 + Math.random() * 0.25
        });
    }

    particles = []; floatingTexts = [];
    keys = { left: false, right: false, jumpPressed: false };
    distance = 0; cameraX = 0; gameRunning = true;
    currentDimension = 0; dimensionFlash = 0;
    lastMilestone = 0;
    document.getElementById('distanceHUD').innerText = formatDist(distance);
    updateMenuCoins();
    document.getElementById('gameOverModal').classList.remove('active');
}

function createDust(x, y, count = 5, isDoubleJump = false) {
    for(let i=0; i<count; i++) {
        particles.push({
            type: 'dust', x: x + (Math.random()*12 - 6), y: y + (isDoubleJump ? -20 : 0),
            vx: Math.random()*3 - 1.5, 
            vy: isDoubleJump ? (Math.random()*3) : (-Math.random()*1.5 - 0.5),
            size: Math.random()*3 + 2, alpha: 1
        });
    }
}

function ensureHeartsOnPlatforms() {
    if (lives >= 3) return;
    let availablePlats = platforms.filter(pt => pt.x > p.x + 60 && !pt.coin && !pt.heart);
    if (availablePlats.length > 0) {
        let countToSpawn = Math.min(2, availablePlats.length);
        for (let i = 0; i < countToSpawn; i++) {
            availablePlats[i].heart = true;
        }
    }
}

function updateWorldElements() {
    let lastPlat = platforms[platforms.length - 1];
    
     
    let diffMultiplier = Math.min(2.5, 1 + (distance / 800)); 
    
    while (lastPlat.x < cameraX + viewportW + 300) {
        
        let gap = (60 + Math.random() * 120) * diffMultiplier;
        let newX = lastPlat.x + lastPlat.w + gap; 
        
       
        let maxJumpUp = gap > (120 * diffMultiplier) ? 30 : (90 * diffMultiplier); 
        let yOffset = (Math.random() * (maxJumpUp + 110)) - maxJumpUp;
        let newY = Math.max(160, Math.min(viewportH - 130, lastPlat.y + yOffset));
        
       
        let platWidth = (70 + Math.random() * 90) / Math.min(1.5, diffMultiplier);
        
        let isCoin = Math.random() > 0.25;
        let isHeart = !isCoin && (lives < 3) && (Math.random() < 0.4);

        platforms.push({ x: newX, y: newY, w: platWidth, h: 22, coin: isCoin, heart: isHeart });
        lastPlat = platforms[platforms.length - 1];
    }
    platforms = platforms.filter(pt => pt.x + pt.w > cameraX - 200);

    let lastBg = bgElements.length > 0 ? bgElements[bgElements.length - 1] : { x: cameraX * 0.3 };
    while (lastBg.x < (cameraX * 0.3) + viewportW + 400) { 
        bgElements.push({
            x: lastBg.x + 220 + Math.random() * 180,
            scale: 0.5 + Math.random() * 0.5,
            seed: Math.floor(Math.random() * 1000)
        });
        lastBg = bgElements[bgElements.length - 1];
    }
    bgElements = bgElements.filter(bg => bg.x > (cameraX * 0.3) - 300);

    let camParallaxX = cameraX * 0.1;
    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x < camParallaxX - 200) c.x = camParallaxX + viewportW + 200;
        if (c.x > camParallaxX + viewportW + 200) c.x = camParallaxX - 200; 
    });
}

window.addEventListener('keydown', e => {
    initAudio();
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jumpPressed = true;
});
window.addEventListener('keyup', e => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
});

const setupTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); keys[key] = true; });
    el.addEventListener('pointerup', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('pointerleave', e => { e.preventDefault(); keys[key] = false; });
};
setupTouch('leftBtn', 'left');
setupTouch('rightBtn', 'right');
document.getElementById('jumpBtn').addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); keys.jumpPressed = true;
});

function gameLoop() {
    if (!gameRunning) return;

    const accel = p.grounded ? 0.6 : 0.35; 
    const friction = p.grounded ? 0.82 : 0.90; 

    if (keys.left) { p.vx -= accel; p.facing = -1; } 
    else if (keys.right) { p.vx += accel; p.facing = 1; } 
    else { p.vx *= friction; }
    
    p.vx = Math.max(-6, Math.min(6, p.vx));
    p.x += p.vx; p.lastY = p.y; 

    p.vy += 0.75; 
    p.y += p.vy;

    if (p.grounded) {
        p.coyoteTimer = 7;
        p.jumpsLeft = 2; 
    } else {
        p.coyoteTimer--;
    }

    if (keys.jumpPressed) {
        if (p.coyoteTimer > 0 || p.jumpsLeft > 0) {
            
            
            p.vy = -14.5;
            
            if (p.coyoteTimer <= 0) {
                
                p.jumpsLeft--; 
                createDust(p.x + p.w/2, p.y + p.h, 10, true); 
                playSfx(250, 600, 'square', 0.1, 0.08); 
            } else {
            
                p.jumpsLeft--; 
                createDust(p.x + p.w/2, p.y + p.h, 6, false);
                playSfx(180, 450, 'square', 0.12, 0.08);
            }
            
            p.coyoteTimer = 0; 
            p.scaleY = 1.3; p.scaleX = 0.75;
        }
        keys.jumpPressed = false; 
    }

    p.scaleX += (1 - p.scaleX) * 0.15;
    p.scaleY += (1 - p.scaleY) * 0.15;

    let targetCamX = p.x - viewportW * 0.35;
    cameraX += (targetCamX - cameraX) * 0.08;

    
    let currentDist = Math.max(0, Math.floor((p.x - 100) / 10));
    if (currentDist > distance) {
        distance = currentDist;
        document.getElementById('distanceHUD').innerText = formatDist(distance);
        
        
        if (distance > 0 && distance % 500 === 0 && distance !== lastMilestone) {
            lastMilestone = distance;
            let bonusCoins = (distance / 500) * 100; // 500m=100, 1000m=200, dst.
            totalCoins += bonusCoins;
            localStorage.setItem('edward_total_coins', totalCoins);
            document.getElementById('hudCoins').innerText = totalCoins;
            
            playSfx(500, 1200, 'sine', 0.4, 0.2); 
            floatingTexts.push({ x: p.x + p.w/2, y: p.y - 60, text: `🎉 +${bonusCoins} 🪙`, alpha: 1.5 });
            showToast(`Luar Biasa! ${distance}m Tercapai! Bonus ${bonusCoins} Koin!`, true);
        }
    }

    updateWorldElements();

    let wasGrounded = p.grounded;
    p.grounded = false;

    let dimCheck = Math.floor(distance / 250);
    if(dimCheck > currentDimension && distance > 0) {
        currentDimension = dimCheck;
        dimensionFlash = 1;
        playSfx(800, 150, 'sawtooth', 0.6, 0.3);
        floatingTexts.push({ x: p.x + p.w/2, y: p.y - 30, text: "DIMENSI BARU!", alpha: 1 });
    }
    let curTheme = themes[currentDimension % themes.length];

    platforms.forEach(pt => {
        let isInsideX = p.x + p.w > pt.x && p.x < pt.x + pt.w;
        let isFalling = p.vy > 0;
        if (isInsideX && isFalling && p.lastY + p.h <= pt.y + 12 && p.y + p.h >= pt.y) {
            p.y = pt.y - p.h; p.vy = 0; p.grounded = true;
            if (!wasGrounded) {
                p.scaleY = 0.75; p.scaleX = 1.25;
                createDust(p.x + p.w/2, p.y + p.h, 7);
                playSfx(100, 50, 'sine', 0.08, 0.05);
            }
        }

        if (pt.coin) {
            let cx = pt.x + pt.w / 2, cy = pt.y - 24;
            let dx = (p.x + p.w/2) - cx, dy = (p.y + p.h/2) - cy;
            if (Math.sqrt(dx*dx + dy*dy) < 26) {
                pt.coin = false; 
                totalCoins += 10;
                localStorage.setItem('edward_total_coins', totalCoins);
                document.getElementById('hudCoins').innerText = totalCoins;
                playSfx(750, 1100, 'sine', 0.18, 0.12);
                floatingTexts.push({ x: cx, y: cy, text: "+10 🪙", alpha: 1 });
            }
        }

        if (pt.heart) {
            let hx = pt.x + pt.w / 2, hy = pt.y - 24;
            let dx = (p.x + p.w/2) - hx, dy = (p.y + p.h/2) - hy;
            if (Math.sqrt(dx*dx + dy*dy) < 26) {
                pt.heart = false;
                if (lives < 3) {
                    lives++;
                    updateLivesUI();
                    playSfx(500, 950, 'sine', 0.22, 0.15);
                    floatingTexts.push({ x: hx, y: hy, text: "+1 ❤️", alpha: 1 });
                }
            }
        }
    });

    if (p.grounded && Math.abs(p.vx) > 3 && Math.random() < 0.25) createDust(p.x + (p.facing === 1 ? 0 : p.w), p.y + p.h, 1);

    if (p.y > viewportH - 60) {
        if (lives > 1) {
            lives--;
            updateLivesUI();
            playSfx(150, 50, 'sawtooth', 0.25, 0.2);
            floatingTexts.push({ x: p.x + p.w/2, y: viewportH - 120, text: "-1 ❤️", alpha: 1 });
            
            let safePlat = platforms.find(pt => pt.x + pt.w > cameraX + 80 && pt.x < cameraX + viewportW - 100);
            if (!safePlat) safePlat = platforms[0];
            
            p.x = safePlat.x + safePlat.w / 2 - p.w / 2;
            p.y = safePlat.y - p.h - 30;
            p.vx = 0;
            p.vy = 0;
            p.grounded = false;

            ensureHeartsOnPlatforms();
        } else {
            lives = 0;
            updateLivesUI();
            gameRunning = false; 
            playSfx(220, 50, 'sawtooth', 0.35, 0.15);
            
            if (distance > highDistance) {
                highDistance = distance; 
                localStorage.setItem('edward_high_dist', highDistance);
                document.getElementById('loginHighScore').innerText = formatDist(highDistance);
            }
            
            document.getElementById('finalScore').innerText = formatDist(distance);
            document.getElementById('bestScore').innerText = formatDist(highDistance);
            document.getElementById('gameOverModal').classList.add('active');
            updateMenuCoins();
            return;
        }
    }

   
    ctx.clearRect(0, 0, viewportW, viewportH);

    let jam = new Date().getHours();
    let isNight = (jam >= 18 || jam < 6); 

    let skyGrad = ctx.createLinearGradient(0, 0, 0, viewportH);
    skyGrad.addColorStop(0, isNight ? curTheme.night1 : curTheme.sky1);
    skyGrad.addColorStop(1, isNight ? curTheme.night2 : curTheme.sky2);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, viewportW, viewportH);

    if(isNight && curTheme.type === 'earth') {
        ctx.fillStyle = "#ffffff";
        stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size*1.5, s.size*1.5); });
    }

    let timeOsc = Math.sin(Date.now() * 0.002);
    if (curTheme.type === 'earth') {
        if(isNight) {
            ctx.fillStyle = "#f1f2f6";
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = curTheme.night1; 
            ctx.beginPath(); ctx.arc(viewportW - 110, 90, 35, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = "#ffefad"; 
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 60 + timeOsc*5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffdd59";
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 45, 0, Math.PI*2); ctx.fill();
        }
    } else if (curTheme.type === 'cyber') {
        ctx.fillStyle = isNight ? "#00ffff" : "#ff007f";
        ctx.beginPath(); ctx.arc(viewportW - 100, 100, 50, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = isNight ? curTheme.night1 : curTheme.sky1;
        for(let i=0; i<5; i++) ctx.fillRect(viewportW - 160, 110 + i*10, 120, 3 + i);
    } else if (curTheme.type === 'alien') {
        ctx.fillStyle = isNight ? "#2d98da" : "#eb4d4b";
        ctx.beginPath(); ctx.arc(viewportW - 100, 100, 45, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = isNight ? "rgba(0, 210, 211, 0.6)" : "rgba(240, 147, 43, 0.6)";
        ctx.lineWidth = 15;
        ctx.beginPath(); ctx.ellipse(viewportW - 100, 100, 70, 20, Math.PI/8, 0, Math.PI*2); ctx.stroke();
    }

    ctx.fillStyle = isNight ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.7)";
    clouds.forEach(c => {
        let drawX = c.x - cameraX * 0.1; 
        ctx.beginPath();
        ctx.arc(drawX, c.y, 25*c.scale, Math.PI, Math.PI*2);
        ctx.arc(drawX + 15*c.scale, c.y - 10*c.scale, 20*c.scale, Math.PI, Math.PI*2);
        ctx.arc(drawX + 35*c.scale, c.y, 25*c.scale, Math.PI, Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle = isNight ? "rgba(0,0,0,0.4)" : "rgba(255,255,255,0.07)";
    bgElements.forEach(bg => {
        let drawX = bg.x - cameraX * 0.3;
        ctx.beginPath(); ctx.moveTo(drawX, viewportH - 70);
        ctx.lineTo(drawX + 150*bg.scale, viewportH - 70 - 250*bg.scale - (bg.seed%50));
        ctx.lineTo(drawX + 300*bg.scale, viewportH - 70); ctx.fill();
    });

    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(pt => {
        ctx.fillStyle = curTheme.plat;
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, pt.h + 500, 8); ctx.fill(); 

        ctx.fillStyle = curTheme.top;
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, pt.h, 8); ctx.fill();
        
        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.beginPath(); ctx.roundRect(pt.x, pt.y + pt.h, pt.w, 8, 0); ctx.fill();

        if (pt.coin) {
            coinAngle += 0.05;
            let cy = pt.y - 24 + Math.sin(coinAngle + pt.x)*4;
            let cx = pt.x + pt.w/2;
            ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#b45309"; ctx.font = "900 13px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("E", cx, cy);
        }

        if (pt.heart) {
            heartAngle += 0.08;
            let hy = pt.y - 24 + Math.sin(heartAngle + pt.x) * 4;
            let hx = pt.x + pt.w / 2;
            ctx.save(); ctx.translate(hx, hy); 
            ctx.scale(1 + Math.sin(heartAngle*1.5)*0.1, 1 + Math.sin(heartAngle*1.5)*0.1);
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.moveTo(0, -3);
            ctx.bezierCurveTo(0, -9, 8, -9, 8, -3);
            ctx.bezierCurveTo(8, 2, 0, 8, 0, 10);
            ctx.bezierCurveTo(0, 8, -8, 2, -8, -3);
            ctx.bezierCurveTo(-8, -9, 0, -9, 0, -3);
            ctx.fill(); ctx.restore();
        }
    });

    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h); 
    ctx.scale(p.scaleX * p.facing, p.scaleY); 

    let legSwing = p.grounded ? Math.sin(p.walkCycle) * 8 : (p.vy > 0 ? -4 : 6);
    if(p.grounded && Math.abs(p.vx) > 0.5) p.walkCycle += 0.35; else legSwing = 0;

    drawPlayerSkin(ctx, p, legSwing, selectedSkin, playerColor);

    ctx.restore();

    particles.forEach((pt, i) => {
        pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.025; pt.size *= 0.95;
        ctx.fillStyle = `rgba(255,255,255,${pt.alpha})`;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
        if(pt.alpha <= 0) particles.splice(i, 1);
    });

    floatingTexts.forEach((ft, i) => {
        ft.y -= 1.2; ft.alpha -= 0.015;
        ctx.fillStyle = `rgba(255, 215, 0, ${ft.alpha})`;
        if (ft.text.includes("❤️")) ctx.fillStyle = `rgba(255, 71, 87, ${ft.alpha})`;
        if (ft.text.includes("DIMENSI")) ctx.fillStyle = `rgba(56, 189, 248, ${ft.alpha})`;
        ctx.font = "900 16px system-ui"; ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.shadowBlur = 0;
        if(ft.alpha <= 0) floatingTexts.splice(i, 1);
    });

    ctx.restore(); 

    ctx.fillStyle = curTheme.lava;
    ctx.fillRect(0, viewportH - 60, viewportW, 60);
    ctx.fillStyle = isNight ? "rgba(255, 255, 255, 0.15)" : "rgba(255, 255, 255, 0.25)";
    ctx.beginPath();
    for(let i=0; i<=viewportW; i+=20) ctx.lineTo(i, viewportH - 60 + Math.sin(i*0.04 + Date.now()*0.003)*12);
    ctx.lineTo(viewportW, viewportH); ctx.lineTo(0, viewportH); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(0, viewportH - 30, viewportW, 30);

    if (dimensionFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${dimensionFlash})`;
        ctx.fillRect(0, 0, viewportW, viewportH);
        dimensionFlash -= 0.03;
    }

    if (gameRunning) animId = requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
