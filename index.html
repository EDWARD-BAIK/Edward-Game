<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDWARD Game</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            background: #090a0f; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #090a0f; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader-title {
            font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .progress-box {
            width: 240px; height: 10px; background: rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
        }
        .progress-bar {
            width: 0%; height: 100%; background: linear-gradient(90deg, #ff4500, #ffaa00);
            border-radius: 10px; transition: width 0.3s ease;
        }
        .loading-status { color: #94a3b8; font-size: 12px; margin-top: 10px; font-weight: 600; }

        #loginOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090a0f 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; display: none; transition: opacity 0.4s ease;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px; padding: 32px 28px; width: 88%; max-width: 380px;
            text-align: center; color: #fff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .login-card h1 {
            margin: 0 0 6px; font-size: 34px; font-weight: 900; letter-spacing: 1px;
            background: linear-gradient(45deg, #ff4500, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
        .input-group input[type="text"] {
            width: 100%; padding: 14px 18px; font-size: 15px; color: #fff; font-weight: 600;
            background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 14px; outline: none; transition: all 0.3s ease;
        }
        .input-group input[type="text"]:focus {
            border-color: #ff4500; box-shadow: 0 0 16px rgba(255,69,0,0.35);
        }
        
        .color-picker { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        .color-opt {
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .color-opt.selected { border-color: #ffffff; transform: scale(1.2); }

        #startBtn {
            width: 100%; padding: 16px; font-size: 16px; font-weight: 800; color: white;
            background: linear-gradient(45deg, #ff4500, #ff7700);
            border: none; border-radius: 14px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 69, 0, 0.4); margin-top: 12px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        #startBtn:active { transform: scale(0.97); }

        .high-score-tag {
            margin-top: 18px; font-size: 13px; color: #ffd700; font-weight: 700;
            background: rgba(255, 215, 0, 0.1); padding: 8px 14px; border-radius: 20px;
            display: inline-block; border: 1px solid rgba(255, 215, 0, 0.2);
        }

        #gameUI {
            position: absolute; top: 18px; left: 18px; right: 18px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85); 
            padding: 10px 18px; border-radius: 20px; color: white;
            border: 1px solid rgba(255,255,255,0.15); font-weight: 700; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .score-badge { color: #ffd700; font-weight: 900; }
        .lives-badge { color: #ff4757; font-weight: 900; }

        .ctrl { 
            position: absolute; bottom: 25px; width: 70px; height: 70px; 
            background: rgba(255,255,255,0.15);
            border-radius: 50%; font-size: 24px; color: white; z-index: 100; 
            border: 1.5px solid rgba(255,255,255,0.3); display: flex; 
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.1s;
        }
        .ctrl:active { background: rgba(255,69,0,0.6); border-color: #ff4500; }
        #leftBtn { left: 20px; } 
        #rightBtn { left: 100px; }
        #jumpBtn { 
            position: absolute; bottom: 25px; right: 20px; width: 80px; height: 80px; 
            border-radius: 50%; background: linear-gradient(135deg, #ff4500, #ff7700); 
            color: white; font-size: 13px; font-weight: 900; z-index: 100; 
            border: 2px solid #ffffff; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 8px 20px rgba(255, 69, 0, 0.5);
            letter-spacing: 0.5px;
        }
        #jumpBtn:active { transform: scale(0.92); }

        #gameOverModal { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(0.85); 
            background: rgba(15, 23, 42, 0.95);
            padding: 28px; border-radius: 28px; text-align: center; color: white;
            display: none; opacity: 0; z-index: 999; width: 88%; max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #gameOverModal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #gameOverModal h2 { color: #ff4500; margin: 0 0 8px; font-size: 26px; font-weight: 900; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal {
            flex: 1; padding: 14px; font-weight: 800; border-radius: 12px; border: none; cursor: pointer; font-size: 13px;
        }
        #respawnBtn { background: #ff4500; color: white; box-shadow: 0 4px 15px rgba(255,69,0,0.4); }
        #changeUserBtn { background: rgba(255,255,255,0.15); color: white; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="loader-title">EDWARD GAME</div>
    <div class="progress-box">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="loading-status" id="loadingStatus">Memuat aset...</div>
</div>

<div id="loginOverlay">
    <div class="login-card">
        <h1>EDWARD GAME</h1>
        <p>Parkur Lintas Dimensi</p>
        
        <div class="input-group">
            <label for="playerNameInput">NAMA PEMAIN</label>
            <input type="text" id="playerNameInput" placeholder="Ketik nama kamu..." maxlength="12" value="">
        </div>

        <div class="input-group">
            <label>WARNA KARAKTER</label>
            <div class="color-picker" id="colorPicker">
                <div class="color-opt selected" data-color="#ff4500" style="background:#ff4500;"></div>
                <div class="color-opt" data-color="#00d2d3" style="background:#00d2d3;"></div>
                <div class="color-opt" data-color="#a55eea" style="background:#a55eea;"></div>
                <div class="color-opt" data-color="#ff9f43" style="background:#ff9f43;"></div>
                <div class="color-opt" data-color="#10ac84" style="background:#10ac84;"></div>
            </div>
        </div>

        <button id="startBtn">MAINKAN SEKARANG</button>
        <div class="high-score-tag">🏆 Rekor: <span id="loginHighScore">0</span></div>
    </div>
</div>

<div id="gameUI">
    <div class="hud-badge">👤 <span id="displayPlayerName">Player</span></div>
    <div class="hud-badge lives-badge">❤️ <span id="lives">3</span></div>
    <div class="hud-badge score-badge">🪙 <span id="score">0</span></div>
</div>

<div id="leftBtn" class="ctrl">◀</div>
<div id="rightBtn" class="ctrl">▶</div>
<div id="jumpBtn">LOMPAT</div>

<div id="gameOverModal">
    <h2>KAMU KALAH</h2>
    <p style="margin: 5px 0; color:#cbd5e1;">Skor Kamu: <b id="finalScore" style="color:#ffd700; font-size:18px;">0</b></p>
    <p style="margin: 0; font-size:13px; color:#94a3b8;">Rekor Terbaik: <span id="bestScore">0</span></p>
    <div class="btn-group">
        <button id="respawnBtn" class="btn-modal">MAIN LAGI</button>
        <button id="changeUserBtn" class="btn-modal">MENU</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSfx(freqStart, freqEnd, type, duration, vol) {
    if (!audioCtx) return;
    try {
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
        if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

let playerName = "Edward";
let playerColor = "#ff4500";
let highScore = localStorage.getItem('edward_highscore') || 0;
let animId; 
let lives = 3;
let heartAngle = 0;
document.getElementById('loginHighScore').innerText = highScore;

function updateLivesUI() {
    let livesEl = document.getElementById('lives');
    if (livesEl) livesEl.innerText = lives;
}

window.addEventListener('load', () => {
    let bar = document.getElementById('progressBar');
    let status = document.getElementById('loadingStatus');
    let progress = 0;
    let interval = setInterval(() => {
        progress += Math.floor(Math.random() * 25) + 15;
        if(progress > 100) progress = 100;
        bar.style.width = progress + '%';
        if (progress === 100) {
            clearInterval(interval);
            status.innerText = "Siap!";
            setTimeout(() => {
                document.getElementById('loadingOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
                let loginOverlay = document.getElementById('loginOverlay');
                loginOverlay.style.display = 'flex';
                setTimeout(() => loginOverlay.style.opacity = '1', 50);
            }, 300);
        }
    }, 120);
});

document.querySelectorAll('.color-opt').forEach(opt => {
    opt.addEventListener('click', () => {
        document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        playerColor = opt.getAttribute('data-color');
    });
});

function startGame() {
    let input = document.getElementById('playerNameInput').value.trim();
    if (input) playerName = input;
    document.getElementById('displayPlayerName').innerText = playerName;
    
    initAudio();
    playSfx(400, 800, 'sine', 0.15, 0.1);

    let overlay = document.getElementById('loginOverlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 400);

    resetGame();
    cancelAnimationFrame(animId);
    gameLoop();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('respawnBtn').addEventListener('click', startGame);

document.getElementById('changeUserBtn').addEventListener('click', () => {
    document.getElementById('gameOverModal').classList.remove('active');
    let overlay = document.getElementById('loginOverlay');
    overlay.style.display = 'flex';
    setTimeout(() => overlay.style.opacity = '1', 10);
});


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let dpr = 1;
let viewportW = window.innerWidth;
let viewportH = window.innerHeight;

function resizeCanvas() {
    viewportW = window.innerWidth;
    viewportH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2); 
    canvas.width = viewportW * dpr;
    canvas.height = viewportH * dpr;
    canvas.style.width = viewportW + 'px';
    canvas.style.height = viewportH + 'px';
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();


let p, platforms, particles, floatingTexts, keys, score, cameraX, gameRunning;
let bgElements = [];
let stars = [];
let clouds = [];
let currentDimension = 0;
let dimensionFlash = 0;

const themes = [
    { type: 'earth', plat: "#1e293b", top: "#00d2d3", lava: "#ff4500", sky1: "#6ebbf5", sky2: "#c5e8ff", night1: "#050B14", night2: "#172033" }, 
    { type: 'cyber', plat: "#2f002c", top: "#ff007f", lava: "#00ffff", sky1: "#10002b", sky2: "#3c096c", night1: "#050014", night2: "#190033" },
    { type: 'alien', plat: "#1a3622", top: "#00e676", lava: "#c51162", sky1: "#4a148c", sky2: "#b71c1c", night1: "#260e40", night2: "#4a0b22" }  
];

function resetGame() {
    lives = 3;
    updateLivesUI();

    p = { 
        x: 100, y: viewportH - 300, lastY: viewportH - 300, 
        w: 24, h: 42, vx: 0, vy: 0, 
        grounded: false, scaleX: 1, scaleY: 1, 
        walkCycle: 0, facing: 1, coyoteTimer: 0, jumpBufferTimer: 0
    };
    
    platforms = [
        { x: 50, y: viewportH - 180, w: 260, h: 25, coin: false, heart: false },
        { x: 360, y: viewportH - 240, w: 160, h: 25, coin: true, heart: false }
    ];
    
    stars = [];
    for(let i=0; i<150; i++){
        stars.push({ x: Math.random() * viewportW, y: Math.random() * viewportH * 0.7, size: Math.random() * 1.5 });
    }

    bgElements = [];
    let startX = 100;
    for(let i=0; i<6; i++){
        startX += 200 + Math.random() * 150;
        bgElements.push({ 
            x: startX, 
            scale: 0.5 + Math.random()*0.5,
            seed: Math.floor(Math.random() * 1000)
        });
    }

    clouds = [];
    for(let i=0; i<7; i++){
        clouds.push({
            x: Math.random() * viewportW * 1.5,
            y: 30 + Math.random() * (viewportH * 0.4),
            scale: 0.5 + Math.random() * 0.8,
            speed: 0.15 + Math.random() * 0.25
        });
    }

    particles = []; floatingTexts = [];
    keys = { left: false, right: false, jumpPressed: false };
    score = 0; cameraX = 0; gameRunning = true;
    currentDimension = 0; dimensionFlash = 0;
    document.getElementById('score').innerText = '0';
    document.getElementById('gameOverModal').classList.remove('active');
}

function createDust(x, y, count = 5) {
    for(let i=0; i<count; i++) {
        particles.push({
            type: 'dust', x: x + (Math.random()*12 - 6), y: y,
            vx: Math.random()*3 - 1.5, vy: -Math.random()*1.5 - 0.5,
            size: Math.random()*3 + 2, alpha: 1
        });
    }
}

function ensureHeartsOnPlatforms() {
    if (lives >= 3) return;
    let availablePlats = platforms.filter(pt => pt.x > p.x + 60 && !pt.coin && !pt.heart);
    if (availablePlats.length > 0) {
        let countToSpawn = Math.min(2, availablePlats.length);
        for (let i = 0; i < countToSpawn; i++) {
            availablePlats[i].heart = true;
        }
    }
}

function updateWorldElements() {
    let lastPlat = platforms[platforms.length - 1];
    while (lastPlat.x < cameraX + viewportW + 300) {
        let gap = 60 + Math.random() * 100;
        let newX = lastPlat.x + lastPlat.w + gap; 
        let maxJumpUp = gap > 120 ? 20 : 80; 
        let yOffset = (Math.random() * (maxJumpUp + 110)) - maxJumpUp;
        let newY = Math.max(160, Math.min(viewportH - 130, lastPlat.y + yOffset));
        
        let isCoin = Math.random() > 0.25;
        let isHeart = !isCoin && (lives < 3) && (Math.random() < 0.5);

        platforms.push({ x: newX, y: newY, w: 70 + Math.random() * 80, h: 22, coin: isCoin, heart: isHeart });
        lastPlat = platforms[platforms.length - 1];
    }
    platforms = platforms.filter(pt => pt.x + pt.w > cameraX - 200);

    let lastBg = bgElements.length > 0 ? bgElements[bgElements.length - 1] : { x: cameraX * 0.3 };
    while (lastBg.x < (cameraX * 0.3) + viewportW + 400) { 
        bgElements.push({
            x: lastBg.x + 220 + Math.random() * 180,
            scale: 0.5 + Math.random() * 0.5,
            seed: Math.floor(Math.random() * 1000)
        });
        lastBg = bgElements[bgElements.length - 1];
    }
    bgElements = bgElements.filter(bg => bg.x > (cameraX * 0.3) - 300);

    let camParallaxX = cameraX * 0.1;
    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x < camParallaxX - 200) c.x = camParallaxX + viewportW + 200;
        if (c.x > camParallaxX + viewportW + 200) c.x = camParallaxX - 200; 
    });
}


window.addEventListener('keydown', e => {
    initAudio();
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') keys.jumpPressed = true;
});
window.addEventListener('keyup', e => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
});

const setupTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); keys[key] = true; });
    el.addEventListener('pointerup', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('pointerleave', e => { e.preventDefault(); keys[key] = false; });
};
setupTouch('leftBtn', 'left');
setupTouch('rightBtn', 'right');
document.getElementById('jumpBtn').addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio(); keys.jumpPressed = true;
});

let coinAngle = 0;


function gameLoop() {
    if (!gameRunning) return;

    const accel = p.grounded ? 0.6 : 0.35; 
    const friction = p.grounded ? 0.82 : 0.90; 

    if (keys.left) { p.vx -= accel; p.facing = -1; } 
    else if (keys.right) { p.vx += accel; p.facing = 1; } 
    else { p.vx *= friction; }
    
    p.vx = Math.max(-6, Math.min(6, p.vx));
    p.x += p.vx; p.lastY = p.y; 

    p.vy += 0.75; 
    p.y += p.vy;

    if (p.grounded) p.coyoteTimer = 7; else p.coyoteTimer--;
    if (keys.jumpPressed) { p.jumpBufferTimer = 7; keys.jumpPressed = false; } else p.jumpBufferTimer--;

    if (p.coyoteTimer > 0 && p.jumpBufferTimer > 0) {
        p.vy = -14.5; p.coyoteTimer = 0; p.jumpBufferTimer = 0;
        p.scaleY = 1.3; p.scaleX = 0.75; 
        playSfx(180, 450, 'square', 0.12, 0.08);
        createDust(p.x + p.w/2, p.y + p.h, 6);
    }

    p.scaleX += (1 - p.scaleX) * 0.15;
    p.scaleY += (1 - p.scaleY) * 0.15;

    let targetCamX = p.x - viewportW * 0.35;
    cameraX += (targetCamX - cameraX) * 0.08;

    updateWorldElements();

    let wasGrounded = p.grounded;
    p.grounded = false;

    let dimCheck = Math.floor(score / 50);
    if(dimCheck > currentDimension && score > 0) {
        currentDimension = dimCheck;
        dimensionFlash = 1;
        playSfx(800, 150, 'sawtooth', 0.6, 0.3);
        floatingTexts.push({ x: p.x + p.w/2, y: p.y - 30, text: "DIMENSI BARU!", alpha: 1 });
    }
    let curTheme = themes[currentDimension % themes.length];

    platforms.forEach(pt => {
        let isInsideX = p.x + p.w > pt.x && p.x < pt.x + pt.w;
        let isFalling = p.vy > 0;
        if (isInsideX && isFalling && p.lastY + p.h <= pt.y + 12 && p.y + p.h >= pt.y) {
            p.y = pt.y - p.h; p.vy = 0; p.grounded = true;
            if (!wasGrounded) {
                p.scaleY = 0.75; p.scaleX = 1.25;
                createDust(p.x + p.w/2, p.y + p.h, 7);
                playSfx(100, 50, 'sine', 0.08, 0.05);
            }
        }

        if (pt.coin) {
            let cx = pt.x + pt.w / 2, cy = pt.y - 24;
            let dx = (p.x + p.w/2) - cx, dy = (p.y + p.h/2) - cy;
            if (Math.sqrt(dx*dx + dy*dy) < 26) {
                pt.coin = false; score += 10;
                document.getElementById('score').innerText = score;
                playSfx(750, 1100, 'sine', 0.18, 0.12);
                floatingTexts.push({ x: cx, y: cy, text: "+10", alpha: 1 });
            }
        }

        if (pt.heart) {
            let hx = pt.x + pt.w / 2, hy = pt.y - 24;
            let dx = (p.x + p.w/2) - hx, dy = (p.y + p.h/2) - hy;
            if (Math.sqrt(dx*dx + dy*dy) < 26) {
                pt.heart = false;
                if (lives < 3) {
                    lives++;
                    updateLivesUI();
                    playSfx(500, 950, 'sine', 0.22, 0.15);
                    floatingTexts.push({ x: hx, y: hy, text: "+1 ❤️", alpha: 1 });
                }
            }
        }
    });

    if (p.grounded && Math.abs(p.vx) > 3 && Math.random() < 0.25) createDust(p.x + (p.facing === 1 ? 0 : p.w), p.y + p.h, 1);

    if (p.y > viewportH - 60) {
        if (lives > 1) {
            lives--;
            updateLivesUI();
            playSfx(150, 50, 'sawtooth', 0.25, 0.2);
            floatingTexts.push({ x: p.x + p.w/2, y: viewportH - 120, text: "-1 ❤️", alpha: 1 });
            
            let safePlat = platforms.find(pt => pt.x + pt.w > cameraX + 80 && pt.x < cameraX + viewportW - 100);
            if (!safePlat) safePlat = platforms[0];
            
            p.x = safePlat.x + safePlat.w / 2 - p.w / 2;
            p.y = safePlat.y - p.h - 30;
            p.vx = 0;
            p.vy = 0;
            p.grounded = false;

            ensureHeartsOnPlatforms();
        } else {
            lives = 0;
            updateLivesUI();
            gameRunning = false; 
            playSfx(220, 50, 'sawtooth', 0.35, 0.15);
            if (score > highScore) {
                highScore = score; localStorage.setItem('edward_highscore', highScore);
                document.getElementById('loginHighScore').innerText = highScore;
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('bestScore').innerText = highScore;
            document.getElementById('gameOverModal').classList.add('active');
            return;
        }
    }

   
    ctx.clearRect(0, 0, viewportW, viewportH);

    let jam = new Date().getHours();
    let isNight = (jam >= 18 || jam < 6); 

    let skyGrad = ctx.createLinearGradient(0, 0, 0, viewportH);
    skyGrad.addColorStop(0, isNight ? curTheme.night1 : curTheme.sky1);
    skyGrad.addColorStop(1, isNight ? curTheme.night2 : curTheme.sky2);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, viewportW, viewportH);

    if(isNight && curTheme.type === 'earth') {
        ctx.fillStyle = "#ffffff";
        stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size*1.5, s.size*1.5); });
    }

    let timeOsc = Math.sin(Date.now() * 0.002);
    if (curTheme.type === 'earth') {
        if(isNight) {
            ctx.fillStyle = "#f1f2f6";
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = curTheme.night1; 
            ctx.beginPath(); ctx.arc(viewportW - 110, 90, 35, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = "#ffefad"; 
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 60 + timeOsc*5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffdd59";
            ctx.beginPath(); ctx.arc(viewportW - 100, 100, 45, 0, Math.PI*2); ctx.fill();
        }
    } else if (curTheme.type === 'cyber') {
        ctx.fillStyle = isNight ? "#00ffff" : "#ff007f";
        ctx.beginPath(); ctx.arc(viewportW - 100, 100, 50, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = isNight ? curTheme.night1 : curTheme.sky1;
        for(let i=0; i<5; i++) ctx.fillRect(viewportW - 160, 110 + i*10, 120, 3 + i);
    } else if (curTheme.type === 'alien') {
        ctx.fillStyle = isNight ? "#2d98da" : "#eb4d4b";
        ctx.beginPath(); ctx.arc(viewportW - 100, 100, 45, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = isNight ? "rgba(0, 210, 211, 0.6)" : "rgba(240, 147, 43, 0.6)";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.ellipse(viewportW - 100, 100, 70, 15, 20 * Math.PI/180, 0, Math.PI*2); ctx.stroke();
    }

    
    ctx.save();
    ctx.translate(-cameraX * 0.1, 0); 
    clouds.forEach(c => {
        if (curTheme.type === 'earth') {
            ctx.fillStyle = isNight ? "#94a3b8" : "#ffffff"; 
            ctx.beginPath(); ctx.arc(c.x, c.y, 30*c.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(c.x + 25*c.scale, c.y - 10*c.scale, 35*c.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(c.x + 50*c.scale, c.y, 30*c.scale, 0, Math.PI*2); ctx.fill();
        } else if (curTheme.type === 'cyber') {
            ctx.fillStyle = "rgba(0, 255, 255, 0.15)";
            ctx.fillRect(c.x, c.y, 80*c.scale, 15*c.scale);
            ctx.fillRect(c.x + 20*c.scale, c.y - 15*c.scale, 50*c.scale, 15*c.scale);
        } else if (curTheme.type === 'alien') {
            ctx.fillStyle = "rgba(162, 155, 254, 0.3)";
            ctx.beginPath(); ctx.ellipse(c.x, c.y, 50*c.scale, 10*c.scale, 0, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(253, 121, 168, 0.5)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(c.x, c.y, 60*c.scale, 15*c.scale, 0, 0, Math.PI*2); ctx.stroke();
        }
    });
    ctx.restore();


    ctx.save();
    ctx.translate(-cameraX * 0.3, 0);
    bgElements.forEach(bg => {
        let ty = viewportH; 
        
        if (curTheme.type === 'earth') {
            let trunkH = 140 * bg.scale, trunkW = 18 * bg.scale;
            ctx.fillStyle = isNight ? "#5c3a21" : "#8B4513";
            ctx.fillRect(bg.x - trunkW/2, ty - trunkH, trunkW, trunkH + 20); 
            
            ctx.fillStyle = isNight ? "#15803d" : "#2ecc71"; 
            ctx.beginPath(); ctx.arc(bg.x, ty - trunkH, 55*bg.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bg.x - 30*bg.scale, ty - trunkH + 15*bg.scale, 40*bg.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bg.x + 30*bg.scale, ty - trunkH + 15*bg.scale, 40*bg.scale, 0, Math.PI*2); ctx.fill();
        } 
        else if (curTheme.type === 'cyber') {
            let bw = 60 * bg.scale, bh = 250 * bg.scale;
            ctx.fillStyle = "#0d0221"; ctx.fillRect(bg.x - bw/2, ty - bh, bw, bh + 20);
            ctx.strokeStyle = "#ff007f"; ctx.lineWidth = 2; ctx.strokeRect(bg.x - bw/2, ty - bh, bw, bh + 20);
            ctx.fillStyle = "#00ffff"; 
            for(let wy = ty - bh + 20*bg.scale; wy < ty - 20; wy += 30*bg.scale) {
                 if((bg.seed + Math.floor(wy)) % 5 !== 0) ctx.fillRect(bg.x - bw/2 + 10*bg.scale, wy, 15*bg.scale, 15*bg.scale);
                 if((bg.seed * Math.floor(wy)) % 5 !== 0) ctx.fillRect(bg.x + bw/2 - 25*bg.scale, wy, 15*bg.scale, 15*bg.scale);
            }
        } 
        else if (curTheme.type === 'alien') {
            let stemH = 140 * bg.scale, stemW = 15 * bg.scale;
            ctx.fillStyle = "#b2bec3"; ctx.beginPath();
            ctx.moveTo(bg.x - stemW, ty); ctx.quadraticCurveTo(bg.x - stemW/2, ty - stemH/2, bg.x - stemW, ty - stemH);
            ctx.lineTo(bg.x + stemW, ty - stemH); ctx.quadraticCurveTo(bg.x + stemW/2, ty - stemH/2, bg.x + stemW, ty); ctx.fill();
            ctx.fillStyle = "#a29bfe"; ctx.beginPath(); ctx.arc(bg.x, ty - stemH, 70*bg.scale, Math.PI, 0); ctx.fill();
            ctx.fillStyle = "#fd79a8"; 
            ctx.beginPath(); ctx.arc(bg.x - 30*bg.scale, ty - stemH - 25*bg.scale, 10*bg.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bg.x + 30*bg.scale, ty - stemH - 35*bg.scale, 15*bg.scale, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(bg.x, ty - stemH - 50*bg.scale, 12*bg.scale, 0, Math.PI*2); ctx.fill();
        }
    });
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(pt => {
        ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(pt.x + 4, pt.y + 6, pt.w, pt.h);
        ctx.fillStyle = curTheme.plat; ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, pt.h, 6); ctx.fill();
        ctx.fillStyle = curTheme.top; ctx.beginPath(); ctx.roundRect(pt.x, pt.y, pt.w, 4, [6, 6, 0, 0]); ctx.fill();
        
        if (pt.coin) {
            coinAngle += 0.04; let scaleC = Math.cos(coinAngle);
            ctx.save(); ctx.translate(pt.x + pt.w/2, pt.y - 22); ctx.scale(scaleC, 1);
            ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#ffa500"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
        }

        if (pt.heart) {
            heartAngle += 0.04;
            let floatY = Math.sin(heartAngle * 2) * 3;
            ctx.save();
            ctx.translate(pt.x + pt.w / 2, pt.y - 22 + floatY);
            ctx.font = "16px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("❤️", 0, 0);
            ctx.restore();
        }
    });

    particles.forEach((pt, idx) => {
        if(pt.type === 'dust') {
            ctx.fillStyle = `rgba(255, 255, 255, ${pt.alpha})`;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
            pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.035;
        }
        if (pt.alpha <= 0) particles.splice(idx, 1);
    });

    floatingTexts.forEach((ft, idx) => {
        ctx.fillStyle = `rgba(255, 215, 0, ${ft.alpha})`; ctx.font = "bold 16px system-ui";
        ctx.fillText(ft.text, ft.x - 15, ft.y); ft.y -= 1.2; ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(idx, 1);
    });

    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h);
    if (p.grounded) {
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(0, -1, 12 * p.scaleX, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.rotate(p.vx * 0.035); ctx.scale(p.scaleX * p.facing, p.scaleY);
    if (Math.abs(p.vx) > 0.2 && p.grounded) p.walkCycle += 0.25;
    let legSwing = Math.sin(p.walkCycle) * 8;

    ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.moveTo(-2, -30);
    ctx.quadraticCurveTo(-14 - p.vx * 2.5, -24 + Math.sin(Date.now()*0.01)*3, -18 - p.vx * 3.5, -12);
    ctx.quadraticCurveTo(-8, -20, -2, -26); ctx.fill();

    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-4 + legSwing, 0);
    ctx.moveTo(4, -12); ctx.lineTo(4 - legSwing, 0); ctx.stroke();

    ctx.fillStyle = playerColor; ctx.beginPath(); ctx.roundRect(-10, -34, 20, 22, 6); ctx.fill();
    ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.arc(0, -40, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(p.facing * 3, -41, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); 
    ctx.restore(); 

    let timeLava = Date.now() * 0.003;
    ctx.fillStyle = curTheme.lava;
    ctx.beginPath(); ctx.moveTo(0, viewportH);
    for (let x = 0; x <= viewportW + 50; x += 25) { 
        let y = viewportH - 30 + Math.sin(x * 0.03 + timeLava) * 6;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(viewportW + 50, viewportH);
    ctx.fill();

    if (dimensionFlash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${dimensionFlash})`;
        ctx.fillRect(0, 0, viewportW, viewportH);
        dimensionFlash -= 0.03; 
    }

    animId = requestAnimationFrame(gameLoop);
}
</script>
</body>
